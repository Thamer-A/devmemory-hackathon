<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevMemory</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo"></span><b>DevMemory</b><span id="proj-name" class="muted"></span></div>
    <button id="qs-btn" class="qs-btn" title="Quick switcher (Ctrl/Cmd+K)"><span>Search vault...</span><kbd>Ctrl K</kbd></button>
    <div class="top-actions">
      <button class="chip-btn" data-open="graph" title="Graph view (G)">Graph <kbd>G</kbd></button>
      <button class="chip-btn" data-open="pack" title="Pack Lab">Pack Lab</button>
      <button class="chip-btn" id="rescan" title="Rescan project">Rescan</button>
    </div>
  </header>
  <aside id="left">
    <div class="side-search"><input id="filter" placeholder="Filter files..." autocomplete="off" spellcheck="false"></div>
    <div id="vault"></div>
  </aside>
  <main id="center">
    <div id="tabs"></div>
    <div id="view"></div>
  </main>
  <aside id="right">
    <section><h4>Linked</h4><div id="linked" class="side-list"></div></section>
    <section><h4>Properties</h4><div id="props" class="props"></div></section>
  </aside>
  <footer id="status"><span id="st-left"></span><span id="st-right"></span></footer>
</div>
<div id="qs" class="hidden">
  <div class="qs-box">
    <input id="qs-input" placeholder="Jump to file, session, decision..." autocomplete="off" spellcheck="false">
    <div id="qs-list"></div>
    <div class="qs-foot"><kbd>Up/Down</kbd> navigate <kbd>Enter</kbd> open <kbd>Esc</kbd> close</div>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
